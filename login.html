    <style>
        /* ==========================================================================
           1. CSS VARIABLES & DESIGN SYSTEM (Premium Light Mode)
           ========================================================================== */
        :root {
            /* SIGMA Brand Palette */
            --sigma-primary: #0F172A;
            --sigma-secondary: #1E293B;
            --sigma-accent: #10B981;
            --sigma-accent-hover: #059669;
            --sigma-accent-light: #D1FAE5;
            --sigma-gold: #F59E0B;
            --sigma-gold-light: #FEF3C7;
            --sigma-danger: #EF4444;
            --sigma-danger-light: #FEE2E2;

            /* Surfaces */
            --bg-body: #F8FAFC;
            --bg-surface: #FFFFFF;
            --bg-subtle: #F1F5F9;
            --bg-glass: rgba(255, 255, 255, 0.9);

            /* Typography Colors */
            --text-main: #0F172A;
            --text-muted: #64748B;
            --text-inverse: #FFFFFF;

            /* Borders & Focus */
            --border-light: rgba(15, 23, 42, 0.08);
            --border-focus: #10B981;

            /* Island UI Layout Settings */
            --radius-pill: 9999px;
            --radius-island: 28px;
            --radius-card: 20px;
            --radius-input: 16px;
            --radius-btn: 14px;

            /* Premium Shadows */
            --shadow-xs: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.06);
            --shadow-island: 0 20px 40px -10px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.02);
            --shadow-float: 0 25px 50px -12px rgba(15, 23, 42, 0.15);

            /* Transitions */
            --transition-fast: 0.2s ease;
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            --safe-area-bottom: env(safe-area-inset-bottom, 20px);
        }

        /* ==========================================================================
           2. GLOBAL RESET & BASE STYLES
           ========================================================================== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 10% 0%, rgba(16, 185, 129, 0.06) 0%, transparent 40vw),
                radial-gradient(circle at 90% 100%, rgba(15, 23, 42, 0.04) 0%, transparent 40vw);
            background-attachment: fixed;
            padding-bottom: calc(100px + var(--safe-area-bottom));
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        button,
        input {
            font-family: inherit;
            border: none;
            outline: none;
            background: none;
        }

        button {
            cursor: pointer;
            user-select: none;
        }

        img {
            max-width: 100%;
            display: block;
            height: auto;
        }

        h1,
        h2,
        h3,
        h4 {
            color: var(--text-main);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.2;
        }

        p {
            color: var(--text-muted);
        }

        /* ==========================================================================
           3. ISLAND TOPBAR (User Interface Public Header)
           ========================================================================== */
        .island-topbar {
            position: sticky;
            top: 12px;
            margin: 0 auto 24px;
            width: calc(100% - 32px);
            max-width: 1160px;
            height: 68px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-pill);
            padding: 0 16px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(255, 255, 255, 0.85);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            flex-wrap: nowrap;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .btn-back {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-subtle);
            color: var(--text-main);
            transition: var(--transition-fast);
            border: 1px solid var(--border-light);
        }

        .btn-back:hover,
        .btn-back:active {
            background: #E2E8F0;
            transform: scale(0.95);
        }

        .btn-back svg {
            width: 20px;
            height: 20px;
            stroke-width: 2.5;
            stroke: currentColor;
            fill: none;
        }

        .brand-cluster {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            flex-shrink: 0;
        }

        .brand-logo-img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .brand-text-img {
            height: 22px;
            object-fit: contain;
            margin-top: 2px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .topbar-action-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: var(--radius-pill);
            background: var(--sigma-primary);
            color: white;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid transparent;
            transition: var(--transition-bounce);
            white-space: nowrap;
        }

        .topbar-action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
        }

        .topbar-action-btn:active {
            transform: scale(0.96);
        }

        .topbar-action-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
        }

        @media (max-width: 480px) {
            .island-topbar {
                padding: 0 10px;
                height: 62px;
            }

            .brand-logo-img {
                width: 32px;
                height: 32px;
            }

            .brand-text-img {
                height: 18px;
            }

            .topbar-action-btn {
                padding: 8px 12px;
                font-size: 0.8rem;
            }

            .topbar-action-btn span {
                display: none;
            }
        }

        /* ==========================================================================
           4. MAIN RESPONSIVE CONTAINER & LOGIN CARD
           ========================================================================== */
        .page-wrapper {
            width: 100%;
            max-width: 1160px;
            margin: 0 auto;
            padding: 0 16px 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: var(--bg-surface);
            border-radius: var(--radius-island);
            box-shadow: var(--shadow-island);
            border: 1px solid rgba(255, 255, 255, 0.8);
            padding: 40px 30px;
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 460px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--sigma-primary), var(--sigma-accent));
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header img {
            height: 44px;
            margin: 0 auto 12px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
        }

        .auth-header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .auth-header p {
            font-size: 0.92rem;
            color: var(--text-muted);
        }

        /* Error Notification Banner */
        .global-error {
            background: var(--sigma-danger-light);
            color: var(--sigma-danger);
            padding: 12px 16px;
            border-radius: var(--radius-btn);
            font-size: 0.85rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.2);
            animation: shake 0.4s ease;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-subtle);
            border-radius: var(--radius-input);
            border: 1.5px solid transparent;
            transition: var(--transition-smooth);
            overflow: hidden;
        }

        .input-wrapper:focus-within {
            background: var(--bg-surface);
            border-color: var(--sigma-accent);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
        }

        .input-wrapper.error {
            border-color: var(--sigma-danger);
            background: var(--sigma-danger-light);
        }

        .input-icon {
            width: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: var(--transition-smooth);
            flex-shrink: 0;
        }

        .input-wrapper:focus-within .input-icon {
            color: var(--sigma-accent);
        }

        .input-wrapper.error .input-icon {
            color: var(--sigma-danger);
        }

        .input-icon svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .input-field {
            flex: 1;
            height: 58px;
            padding: 22px 16px 6px 0;
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .input-field::placeholder {
            color: transparent;
        }

        .floating-label {
            position: absolute;
            left: 50px;
            top: 18px;
            font-size: 0.95rem;
            color: var(--text-muted);
            pointer-events: none;
            transition: 0.2s ease all;
            font-weight: 500;
        }

        .input-field:focus~.floating-label,
        .input-field:not(:placeholder-shown)~.floating-label {
            top: 7px;
            font-size: 0.7rem;
            color: var(--sigma-accent);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper.error .input-field:focus~.floating-label,
        .input-wrapper.error .input-field:not(:placeholder-shown)~.floating-label {
            color: var(--sigma-danger);
        }

        /* Password Specifics */
        .trailing-action {
            width: 50px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: var(--transition-smooth);
        }

        .trailing-action:hover {
            color: var(--text-main);
        }

        .trailing-action svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* Primary Action Button */
        .btn-submit {
            width: 100%;
            height: 56px;
            border-radius: var(--radius-input);
            background: linear-gradient(135deg, var(--sigma-primary), var(--sigma-secondary));
            color: white;
            font-size: 1.05rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.2);
            transition: var(--transition-smooth);
            position: relative;
            margin-top: 10px;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(15, 23, 42, 0.28);
        }

        .btn-submit:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .btn-submit.loading .spinner {
            display: block;
        }

        .btn-submit.loading span {
            display: none;
        }

        .auth-footer {
            text-align: center;
            font-size: 0.92rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 26px;
        }

        .auth-footer a {
            color: var(--sigma-primary);
            font-weight: 800;
            transition: var(--transition-fast);
        }

        .auth-footer a:hover {
            text-decoration: underline;
            color: var(--sigma-accent);
        }

        /* ==========================================================================
           5. PUBLIC MOBILE DOCK (As per index.html architecture)
           ========================================================================== */
        .mobile-dock {
            position: fixed;
            bottom: var(--safe-area-bottom);
            left: 50%;
            transform: translateX(-50%);
            height: 76px;
            width: calc(100% - 40px);
            max-width: 400px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: var(--radius-island);
            box-shadow: var(--shadow-float);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: var(--z-dock);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .dock-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--text-muted);
            width: 64px;
            height: 64px;
            border-radius: 20px;
            transition: var(--transition-bounce);
            text-decoration: none;
        }

        .dock-btn svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            transition: var(--transition-smooth);
        }

        .dock-btn span {
            font-size: 0.65rem;
            font-weight: 700;
        }

        .dock-btn.active {
            color: var(--sigma-primary);
            background: var(--bg-subtle);
        }

        .dock-btn.active svg {
            transform: translateY(-2px);
            stroke-width: 2.5;
        }

        .dock-center {
            position: relative;
            top: -24px;
            width: 76px;
            height: 76px;
            background: linear-gradient(135deg, var(--sigma-primary), var(--sigma-secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.35);
            border: 5px solid var(--bg-body);
            transition: var(--transition-bounce);
            z-index: 2;
        }

        .dock-center:active {
            transform: scale(0.92);
        }

        .dock-center img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .dock-center::after {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            border: 2px solid var(--sigma-accent);
            opacity: 0;
            transition: var(--transition-smooth);
        }

        .dock-center:hover::after {
            opacity: 1;
            transform: scale(1.05);
        }

        @media (min-width: 768px) {
            .mobile-dock {
                display: none;
            }

            body {
                padding-bottom: 0;
            }
        }

        /* Animations */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }
    </style>
</head>

    <!-- =======================================================================
         SINGLE-ROW ISLAND HEADER
         ======================================================================= -->
    <header class="island-topbar">

            <a href="index.html" class="btn-back" aria-label="Go to Homepage">
                <svg>
                    <use href="#icon-back"></use>

            <a href="index.html" class="brand-cluster">
                <img src="assets/logo.png" alt="Sigma" class="brand-logo-img"

    <div class="page-wrapper">

            <div class="auth-header">
                <a href="index.html"><img src="assets/logo.png" alt="Sigma"
                        onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'50\' fill=\'%2310B981\'/><text x=\'50\' y=\'65\' font-family=\'Arial\' font-size=\'40\' fill=\'white\' text-anchor=\'middle\'>S</text></svg>'"></a>
                <h1>Member Login</h1>
                <p>Enter your credentials to access your secure financial portfolio.</p>
            </div>

            <!-- Global Error Notification -->
            <div class="global-error" id="globalError"></div>

            <form id="loginForm" novalidate autocomplete="on">
                <!-- Username / Email / Phone Multi-Credential Resolver -->
                <div class="form-group">
                    <div class="input-wrapper" id="wrapId">
                        <div class="input-icon">
                            <svg>
                                <use href="#icon-user"></use>
                            </svg>
                        </div>
                        <input type="text" id="identifier" class="input-field" placeholder=" " required
                            autocomplete="username">
                        <label class="floating-label">Email, Username or Mobile</label>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <div class="input-wrapper" id="wrapPwd">
                        <div class="input-icon">
                            <svg>
                                <use href="#icon-lock"></use>
                            </svg>
                        </div>
                        <input type="password" id="password" class="input-field" placeholder=" " required
                            autocomplete="current-password">
                        <label class="floating-label">Password</label>
                        <button type="button" class="trailing-action" id="btnTogglePwd" tabindex="-1"
                            aria-label="Toggle password visibility">
                            <svg id="iconPwd">
                                <use href="#icon-eye"></use>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">
                    <span>Secure Login</span>
                    <div class="spinner"></div>
                </button>

                <div class="auth-footer">
                    Don't have an account? <a href="reg.html">Register Now</a>
                </div>
            </form>
        </main>
    </div>

    <!-- =======================================================================
         PUBLIC MOBILE DOCK (Strictly 3 Buttons - Matches Index Architecture)
         ======================================================================= -->
    <nav class="mobile-dock">
        <!-- Button 1: Home -->
        <a href="index.html" class="dock-btn">
            <svg>
                <use href="#icon-home"></use>
            </svg>
            <span>Home</span>
        </a>

        <!-- Button 2: Center Logo (Links to App/Login) -->
        <a href="login.html" class="dock-center" aria-label="SIGMA Dashboard">
            <img src="assets/logo.png" alt="SIGMA"
                onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'50\' fill=\'%2310B981\'/><text x=\'50\' y=\'65\' font-family=\'Arial\' font-size=\'40\' fill=\'white\' text-anchor=\'middle\'>S</text></svg>'">
        </a>

        <!-- Button 3: Account/Login (Active State) -->
        <a href="login.html" class="dock-btn active">
            <svg>
                <use href="#icon-user"></use>
            </svg>
            <span>Account</span>
        </a>
    </nav>

    <!-- ==========================================================================
         JAVASCRIPT AUTHENTICATION & MULTI-CREDENTIAL RESOLVER (STRICT ISOLATION)
         ========================================================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // --- 1. DOM Elements ---
            const form = document.getElementById('loginForm');
            const inId = document.getElementById('identifier');
            const inPwd = document.getElementById('password');
            const wrapId = document.getElementById('wrapId');
            const wrapPwd = document.getElementById('wrapPwd');
            const btnSubmit = document.getElementById('btnSubmit');
            const btnTogglePwd = document.getElementById('btnTogglePwd');
            const iconPwd = document.getElementById('iconPwd');
            const globalError = document.getElementById('globalError');

            // --- 2. Password Visibility Toggle ---
            btnTogglePwd.addEventListener('click', () => {
                const isPwd = inPwd.getAttribute('type') === 'password';
                inPwd.setAttribute('type', isPwd ? 'text' : 'password');
                iconPwd.innerHTML = isPwd ? '<use href="#icon-eye-off"></use>' : '<use href="#icon-eye"></use>';
                inPwd.focus();
            });

            // --- 3. Error Handling UI ---
            const showError = (msg, targetWrap = null) => {
                globalError.textContent = msg;
                globalError.style.display = 'block';
                globalError.classList.remove('shake');
                void globalError.offsetWidth; // Trigger reflow for animation
                globalError.classList.add('shake');

                if (targetWrap) targetWrap.classList.add('error');
            };

            const clearErrors = () => {
                globalError.style.display = 'none';
                wrapId.classList.remove('error');
                wrapPwd.classList.remove('error');
            };

            inId.addEventListener('input', clearErrors);
            inPwd.addEventListener('input', clearErrors);

            // --- 4. Firestore Resolver: Maps Username/Phone to Email for Auth ---
            const resolveToEmail = async (identifier) => {
                const clean = identifier.trim().toLowerCase();

                // If already standard email format, return directly
                if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(clean)) {
                    return clean;
                }

                if (typeof firebase === 'undefined' || !firebase.apps.length) {
                    throw new Error("FIREBASE_OFFLINE");
                }

                const db = firebase.firestore();

                // Check Phone (Allow formats like 03001234567, 923001234567, +923001234567)
                if (/^\+?[0-9]{10,15}$/.test(clean)) {
                    const phoneClean = clean.replace(/[^0-9]/g, '');
                    const phoneSnap = await db.collection('users').where('phone', '==', phoneClean).limit(1).get();
                    if (!phoneSnap.empty) {
                        return phoneSnap.docs[0].data().email.toLowerCase();
                    }
                }

                // Check Username
                const userSnap = await db.collection('users').where('username', '==', clean).limit(1).get();
                if (!userSnap.empty) {
                    return userSnap.docs[0].data().email.toLowerCase();
                }

                // If not found in database
                throw new Error("USER_NOT_FOUND");
            };

            // --- 5. Firebase Initialization & Session Isolation Checking ---
            if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
                const auth = firebase.auth();
                const db = firebase.firestore();

                auth.onAuthStateChanged(async (user) => {
                    if (user) {
                        // Crucial Session Isolation Rule:
                        // Do not arbitrarily sign out another account if this tab discovers an active session.
                        // We check the role. If it is a User, we redirect to User Dashboard safely.
                        // If it is an Admin (logged in on Admin panel in another tab), we DO NOT log them out,
                        // and we DO NOT auto-redirect them from this User Login page, to prevent breaking their Admin session.

                        // If user intentionally clicked logout in this tab previously, stay on login page.
                        if (sessionStorage.getItem('sigma_explicit_logout') === 'true') {
                            return;
                        }

                        try {
                            const userDoc = await db.collection('users').doc(user.uid).get();
                            if (userDoc.exists) {
                                const role = (userDoc.data().role || '').toLowerCase();

                                if (role === 'admin' || role === 'superadmin') {
                                    // This is an Admin user session shared globally in the browser.
                                    // DO NOT call auth.signOut() here, as it will log out their Admin Panel tab.
                                    // Just silently stay on the User Interface login page.
                                    console.warn("Active Administrator session detected. To access user interface, use an incognito window or log out of admin panel.");
                                    return;
                                } else {
                                    // Valid Normal User Session
                                    sessionStorage.setItem('sigma_session_uid', user.uid);
                                    sessionStorage.setItem('sigma_session_logged', 'true');
                                    window.location.replace('dash.html');
                                }
                            }
                        } catch (e) {
                            console.error("Session verification error:", e);
                        }
                    }
                });
            }

            // --- 6. Form Submission & Authentication Workflow ---
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearErrors();

                const identifier = inId.value.trim();
                const pwd = inPwd.value;

                if (!identifier || !pwd) {
                    return showError("Please enter your account credentials.", wrapId);
                }

                btnSubmit.disabled = true;
                btnSubmit.classList.add('loading');

                try {
                    if (typeof firebase === 'undefined' || !firebase.apps.length) {
                        throw new Error("FIREBASE_OFFLINE");
                    }

                    const auth = firebase.auth();
                    const db = firebase.firestore();

                    // Step 1: Securely resolve identifier (Username/Mobile) to Firebase Email
                    const loginEmail = await resolveToEmail(identifier);

                    // Step 2: Authenticate with Firebase
                    // (Note: This will overwrite any existing global Firebase auth state in this browser context)
                    const userCred = await auth.signInWithEmailAndPassword(loginEmail, pwd);

                    // Step 3: Verify User Role & Access Clearance
                    const userDoc = await db.collection('users').doc(userCred.user.uid).get();

                    if (!userDoc.exists) {
                        throw new Error("PROFILE_MISSING");
                    }

                    const userData = userDoc.data();
                    const role = (userData.role || '').toLowerCase();
                    const status = (userData.status || '').toLowerCase();

                    // Reject Suspended Accounts
                    if (status === 'suspended' || status === 'blocked') {
                        // Sign out the suspended session
                        await auth.signOut();
                        throw new Error("ACCOUNT_SUSPENDED");
                    }

                    // Protect against Admin attempting to use User Portal
                    if (role === 'admin' || role === 'superadmin') {
                        // An admin just actively tried to submit the login form on the user page.
                        // We sign them out because this portal is strictly for regular users, 
                        // and they intentionally tried to authenticate here.
                        await auth.signOut();
                        throw new Error("ADMIN_NOT_ALLOWED");
                    }

                    // Success: Establish strict User Interface Session
                    sessionStorage.setItem('sigma_session_uid', userCred.user.uid);
                    sessionStorage.setItem('sigma_session_logged', 'true');
                    sessionStorage.removeItem('sigma_explicit_logout');

                    // Route to Member Dashboard
                    window.location.replace('dash.html');

                } catch (err) {
                    btnSubmit.disabled = false;
                    btnSubmit.classList.remove('loading');

                    console.error("Login Exception:", err);

                    if (err.message === "USER_NOT_FOUND" || err.code === 'auth/user-not-found') {
                        showError("Account not found. Verify your credentials.", wrapId);
                    } else if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
                        showError("Incorrect password.", wrapPwd);
                    } else if (err.message === "ACCOUNT_SUSPENDED") {
                        showError("Access Denied: Your account has been suspended by administration.", wrapId);
                    } else if (err.message === "ADMIN_NOT_ALLOWED") {
                        showError("Administrator credentials are not permitted on the public portal. Please use the designated Admin Panel.", wrapId);
                    } else if (err.message === "FIREBASE_OFFLINE" || err.code === 'auth/network-request-failed') {
                        showError("Network connection error. Please check your internet.");
                    } else if (err.code === 'auth/too-many-requests') {
                        showError("Too many failed attempts. Account temporarily locked for security.");
                    } else {
                        showError("Authentication failed. Please try again.");
                    }
                }
            });
        });
    </script>
