<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sigma | Member Secure Login</title>

    <!-- SEO & Metadata -->
    <meta name="description" content="Access your Sigma automated investment portfolio and daily earnings securely.">
    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://sigmaaz.vercel.app/login.html">

    <!-- Mobile Web App Capability -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sigma Login">

    <!-- Favicon & Touch Icons -->
    <link rel="shortcut icon" href="assets/favicon.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/favicon.png">

    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

    <!-- Firebase SDKs (Compat Libraries for Vanilla JS Integration) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Connect External Config with Fallback Initialization -->
    <script src="firebase-config.js"></script>
    <script>
        // Failsafe Initialization in case firebase-config.js is delayed
        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
            const fallbackConfig = {
                apiKey: "AIzaSyCTRe2w4juZ55DrayIw61qKz_UYlZfw1H8",
                authDomain: "week-team.firebaseapp.com",
                projectId: "week-team",
                storageBucket: "week-team.firebasestorage.app",
                messagingSenderId: "480334485782",
                appId: "1:480334485782:web:c0c886ed710567b9e6d837"
            };
            firebase.initializeApp(fallbackConfig);
            // Enforce Local Persistence for strict session holding
            firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
        }
    </script>

    <style>
        /* ==========================================================================
           1. CSS VARIABLES & DESIGN SYSTEM (Sigma Theme)
           ========================================================================== */
        :root {
            --sigma-primary: #0F172A;
            --sigma-secondary: #1E293B;
            --sigma-accent: #10B981;
            --sigma-danger: #EF4444;
            --sigma-danger-light: #FEE2E2;
            
            --bg-body: #F8FAFC;
            --bg-surface: #FFFFFF;
            --bg-input: #F1F5F9;
            --bg-glass: rgba(255, 255, 255, 0.9);
            
            --text-main: #0F172A;
            --text-muted: #64748B;
            
            --border-light: rgba(15, 23, 42, 0.08);
            --radius-island: 28px;
            --radius-input: 16px;
            --transition-smooth: 0.3s ease;
        }

        /* ==========================================================================
           2. GLOBAL RESET & BASE STYLES
           ========================================================================== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px; 
            background-image:
                radial-gradient(circle at 10% 0%, rgba(16, 185, 129, 0.05) 0%, transparent 40vw),
                radial-gradient(circle at 90% 100%, rgba(15, 23, 42, 0.04) 0%, transparent 40vw);
            background-attachment: fixed;
        }

        a { text-decoration: none; color: var(--sigma-primary); font-weight: 800; transition: var(--transition-smooth); }
        a:hover { text-decoration: underline; }

        /* ==========================================================================
           3. LOGIN CARD & HEADER
           ========================================================================== */
        .login-card { 
            background: var(--bg-surface); 
            border-radius: var(--radius-island); 
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.08); 
            padding: 40px 30px; 
            width: 100%; 
            max-width: 440px; 
            position: relative; 
            border: 1px solid rgba(255,255,255,0.8);
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-card::before { 
            content: ''; 
            position: absolute; 
            top: 0; left: 0; right: 0; 
            height: 5px; 
            background: linear-gradient(90deg, var(--sigma-primary), var(--sigma-accent)); 
        }

        .auth-header { text-align: center; margin-bottom: 30px; }
        .auth-header .brand-cluster { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 14px; text-decoration: none; }
        .auth-header img.logo { height: 42px; object-fit: contain; }
        .auth-header img.text-logo { height: 22px; object-fit: contain; margin-top: 2px; }
        
        .auth-header h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.5px; }
        .auth-header p { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }

        /* ==========================================================================
           4. ERROR NOTIFICATIONS
           ========================================================================== */
        .global-error { 
            background: var(--sigma-danger-light); 
            color: var(--sigma-danger); 
            padding: 12px 16px; 
            border-radius: 12px; 
            font-size: 0.85rem; 
            font-weight: 700; 
            text-align: center; 
            margin-bottom: 20px; 
            display: none; 
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .global-error.shake { animation: shake 0.4s ease; }

        /* ==========================================================================
           5. FORM CONTROLS
           ========================================================================== */
        .input-wrapper { 
            position: relative; 
            display: flex; 
            align-items: center; 
            background: var(--bg-input); 
            border-radius: var(--radius-input); 
            border: 1.5px solid transparent; 
            transition: var(--transition-smooth); 
            overflow: hidden; 
            margin-bottom: 18px; 
        }

        .input-wrapper:focus-within { 
            background: var(--bg-surface); 
            border-color: var(--sigma-accent); 
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12); 
        }

        .input-wrapper.error { 
            border-color: var(--sigma-danger); 
            background: var(--sigma-danger-light); 
        }

        .input-icon { 
            width: 50px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: var(--text-muted); 
            transition: var(--transition-smooth);
            flex-shrink: 0;
        }

        .input-wrapper:focus-within .input-icon { color: var(--sigma-accent); }
        .input-wrapper.error .input-icon { color: var(--sigma-danger); }

        .input-icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }

        .input-field { 
            flex: 1; 
            height: 58px; 
            padding: 22px 16px 6px 0; 
            font-size: 1rem; 
            color: var(--text-main); 
            font-weight: 600; 
            border: none; 
            outline: none; 
            background: transparent;
        }

        .input-field::placeholder { color: transparent; }

        .floating-label { 
            position: absolute; 
            left: 50px; 
            top: 18px; 
            font-size: 0.95rem; 
            color: var(--text-muted); 
            pointer-events: none; 
            transition: 0.2s ease all; 
            font-weight: 500; 
        }

        .input-field:focus ~ .floating-label, 
        .input-field:not(:placeholder-shown) ~ .floating-label { 
            top: 7px; 
            font-size: 0.7rem; 
            color: var(--sigma-accent); 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }

        .input-wrapper.error .floating-label { color: var(--sigma-danger) !important; }

        .btn-toggle-pwd {
            width: 50px; 
            height: 58px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: var(--text-muted); 
            border: none; 
            background: none; 
            cursor: pointer; 
            transition: var(--transition-smooth);
        }

        .btn-toggle-pwd:hover { color: var(--text-main); }
        .btn-toggle-pwd svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }

        .forgot-link {
            display: block;
            text-align: right;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: -8px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .forgot-link:hover { color: var(--sigma-primary); }

        /* ==========================================================================
           6. SUBMIT BUTTON & FOOTER
           ========================================================================== */
        .btn-submit { 
            width: 100%; 
            height: 56px; 
            border-radius: var(--radius-input); 
            background: linear-gradient(135deg, var(--sigma-primary), var(--sigma-secondary)); 
            color: white; 
            font-size: 1.05rem; 
            font-weight: 800; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            border: none; 
            cursor: pointer; 
            transition: 0.2s ease; 
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.2);
        }

        .btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(15, 23, 42, 0.28); }
        .btn-submit:active:not(:disabled) { transform: scale(0.98); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        .spinner { 
            width: 20px; 
            height: 20px; 
            border: 2px solid rgba(255,255,255,0.3); 
            border-top-color: white; 
            border-radius: 50%; 
            animation: spin 0.8s linear infinite; 
            display: none; 
        }

        .btn-submit.loading .spinner { display: block; }
        .btn-submit.loading span { display: none; }

        .auth-footer { 
            text-align: center; 
            font-size: 0.9rem; 
            color: var(--text-muted); 
            margin-top: 24px; 
            font-weight: 500;
        }

        /* Animations */
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
    </style>
</head>
<body>

    <!-- SVG SPRITES -->
    <svg width="0" height="0" style="display:none;" aria-hidden="true">
        <symbol id="icon-user" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></symbol>
        <symbol id="icon-lock" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></symbol>
        <symbol id="icon-eye" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></symbol>
        <symbol id="icon-eye-off" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></symbol>
        <symbol id="icon-check" viewBox="0 0 24 24"><polyline stroke-linecap="round" stroke-linejoin="round" points="20 6 9 17 4 12" /></symbol>
    </svg>

    <main class="login-card">
        <div class="auth-header">
            <a href="index.html" class="brand-cluster">
                <img src="assets/logo.png" alt="Sigma" class="logo" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'><circle cx=\'50\' cy=\'50\' r=\'50\' fill=\'%2310B981\'/></svg>'">
                <img src="assets/textlogo.png" alt="Sigma" class="text-logo" onerror="this.style.display='none'">
            </a>
            <h1>Member Login</h1>
            <p>Access your automated financial terminal.</p>
        </div>

        <div class="global-error" id="globalError"></div>

        <form id="loginForm" novalidate autocomplete="on">
            
            <!-- Multi-Resolver Identifier Input -->
            <div class="form-group">
                <div class="input-wrapper" id="wrapId">
                    <div class="input-icon"><svg><use href="#icon-user"></use></svg></div>
                    <input type="text" id="identifier" class="input-field" placeholder=" " required autocomplete="username">
                    <label class="floating-label">Email, Username or Phone</label>
                </div>
            </div>

            <!-- Password Input -->
            <div class="form-group" style="margin-bottom: 8px;">
                <div class="input-wrapper" id="wrapPwd">
                    <div class="input-icon"><svg><use href="#icon-lock"></use></svg></div>
                    <input type="password" id="password" class="input-field" placeholder=" " required autocomplete="current-password">
                    <label class="floating-label">Password</label>
                    <button type="button" class="btn-toggle-pwd" id="btnTogglePwd" tabindex="-1" aria-label="Toggle password visibility">
                        <svg id="iconPwd"><use href="#icon-eye"></use></svg>
                    </button>
                </div>
            </div>

            <!-- Forgot Password Placeholder Link -->
            <a href="#" class="forgot-link" onclick="alert('Password reset link will be sent to your registered email. Contact Support if you lost access.'); return false;">Forgot Password?</a>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit" id="btnSubmit">
                <span>Secure Login</span>
                <div class="spinner"></div>
            </button>

            <!-- Registration Link -->
            <div class="auth-footer">
                Don't have an account? <a href="reg.html">Register Now</a>
            </div>
        </form>
    </main>

    <!-- =======================================================================
         JAVASCRIPT LOGIC & FIREBASE AUTHENTICATION RESOLVER (Bug Free)
         ======================================================================= -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            console.log("Secure Login Gateway Initialized.");

            // --- 1. DOM Elements ---
            const form = document.getElementById('loginForm');
            const inId = document.getElementById('identifier');
            const inPwd = document.getElementById('password');
            const btnSubmit = document.getElementById('btnSubmit');
            const globalError = document.getElementById('globalError');
            const btnTogglePwd = document.getElementById('btnTogglePwd');
            const iconPwd = document.getElementById('iconPwd');

            // --- 2. Password Toggle ---
            btnTogglePwd.addEventListener('click', () => {
                const isPwd = inPwd.getAttribute('type') === 'password';
                inPwd.setAttribute('type', isPwd ? 'text' : 'password');
                iconPwd.innerHTML = isPwd ? '<use href="#icon-eye-off"></use>' : '<use href="#icon-eye"></use>';
                inPwd.focus();
            });

            // --- 3. Error Handling ---
            const showError = (msg, wrapId = null) => {
                console.warn("Login Error:", msg);
                globalError.textContent = msg;
                globalError.style.display = 'block';
                globalError.classList.remove('shake');
                void globalError.offsetWidth; // Reflow for animation reset
                globalError.classList.add('shake');
                
                if(wrapId) document.getElementById(wrapId).classList.add('error');
            };

            const clearErrors = () => {
                globalError.style.display = 'none';
                document.getElementById('wrapId').classList.remove('error');
                document.getElementById('wrapPwd').classList.remove('error');
            };

            inId.addEventListener('input', clearErrors);
            inPwd.addEventListener('input', clearErrors);

            // --- 4. Firestore Identifier Resolver ---
            // Allows users to login using their Username or Phone instead of just Email
            const resolveToEmail = async (identifier) => {
                const clean = identifier.trim().toLowerCase();
                
                // If it already looks like an email, bypass database lookup and return it directly
                if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(clean)) {
                    return clean;
                }

                const db = firebase.firestore();

                // Check if it's a Phone Number (digits with optional +)
                if (/^\+?[0-9]{10,15}$/.test(clean)) {
                    const phoneSnap = await db.collection('users').where('phone', '==', clean).limit(1).get();
                    if (!phoneSnap.empty) {
                        return phoneSnap.docs[0].data().email;
                    }
                }

                // Check if it's a Username
                const userSnap = await db.collection('users').where('username', '==', clean).limit(1).get();
                if (!userSnap.empty) {
                    return userSnap.docs[0].data().email;
                }

                // If no record found, throw specific error
                throw new Error("USER_NOT_FOUND");
            };

            // --- 5. Firebase Real-Time Session Redirection ---
            // Prevent users who are already logged in from seeing the login screen
            let isRedirecting = false;
            
            if (typeof firebase !== 'undefined') {
                firebase.auth().onAuthStateChanged(async (user) => {
                    if (user && !isRedirecting) {
                        isRedirecting = true; // Prevent loop
                        try {
                            const db = firebase.firestore();
                            const doc = await db.collection('users').doc(user.uid).get();
                            
                            // Route Isolation: Admins go to Admin Panel, Users go to User Dashboard
                            if (doc.exists) {
                                const role = (doc.data().role || '').toLowerCase();
                                if (role === 'admin' || role === 'superadmin') {
                                    window.location.replace('x/dashboard.html'); // Admin Dashboard
                                } else {
                                    window.location.replace('dash.html'); // Normal User Dashboard
                                }
                            } else {
                                // Fallback for edge cases where document is missing
                                window.location.replace('dash.html');
                            }
                        } catch (e) {
                            console.error("Session redirection error:", e);
                            isRedirecting = false;
                        }
                    }
                });
            }

            // --- 6. Form Submission Handling ---
            form.addEventListener('submit', async (e) => {
                e.preventDefault(); // MUST PREVENT DEFAULT REFRESH
                clearErrors();

                const identifier = inId.value.trim();
                const pwd = inPwd.value;

                if (!identifier) return showError("Please enter your Email, Username, or Phone.", "wrapId");
                if (!pwd) return showError("Please enter your password.", "wrapPwd");

                if (typeof firebase === 'undefined' || !firebase.apps.length) {
                    return showError("System offline. Please check your internet connection.");
                }

                btnSubmit.disabled = true;
                btnSubmit.classList.add('loading');
                isRedirecting = true; // Block onAuthStateChanged from firing prematurely during manual login process

                try {
                    const auth = firebase.auth();
                    const db = firebase.firestore();
                    
                    // 1. Resolve identifier to Email securely
                    const loginEmail = await resolveToEmail(identifier);

                    // 2. Authenticate against Firebase Auth
                    const userCred = await auth.signInWithEmailAndPassword(loginEmail, pwd);
                    const uid = userCred.user.uid;

                    // 3. Check Role for Routing
                    const userDoc = await db.collection('users').doc(uid).get();
                    
                    btnSubmit.classList.remove('loading');
                    btnSubmit.innerHTML = `<span><svg style="width:20px;height:20px;stroke:white;fill:none;stroke-width:2.5;"><use href="#icon-check"></use></svg> Authenticated</span>`;
                    btnSubmit.style.background = 'var(--sigma-accent)';

                    if (userDoc.exists) {
                        const role = (userDoc.data().role || '').toLowerCase();
                        const status = (userDoc.data().status || '').toLowerCase();

                        // Block Suspended Users
                        if (status === 'suspended' || status === 'blocked') {
                            await auth.signOut();
                            isRedirecting = false;
                            throw new Error("ACCOUNT_SUSPENDED");
                        }

                        // Proper Isolation Redirect
                        setTimeout(() => {
                            if (role === 'admin' || role === 'superadmin') {
                                window.location.replace('x/dashboard.html');
                            } else {
                                window.location.replace('dash.html');
                            }
                        }, 500);
                    } else {
                        // Edge case: User exists in Auth but not Firestore
                        setTimeout(() => window.location.replace('dash.html'), 500);
                    }

                } catch (err) {
                    isRedirecting = false;
                    btnSubmit.disabled = false;
                    btnSubmit.classList.remove('loading');
                    btnSubmit.innerHTML = `<span>Secure Login</span><div class="spinner"></div>`;
                    btnSubmit.style.background = '';

                    console.error("Login Exception:", err);

                    if (err.message === "USER_NOT_FOUND" || err.code === 'auth/user-not-found') {
                        showError("No account found with this identifier. Please register.", "wrapId");
                    } else if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
                        showError("Incorrect password provided.", "wrapPwd");
                    } else if (err.code === 'auth/too-many-requests') {
                        showError("Too many failed attempts. Please try again later.");
                    } else if (err.message === "ACCOUNT_SUSPENDED") {
                        showError("Your account has been suspended by administration. Contact support.");
                    } else if (err.code === 'auth/network-request-failed') {
                        showError("Network connection failed. Please check your internet.");
                    } else {
                        showError("Login failed. Please verify your credentials and try again.");
                    }
                }
            });
        });
    </script>
</body>
