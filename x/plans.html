<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sigma Admin | Plans Management</title>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="theme-color" content="#0B132B">

    <link rel="shortcut icon" href="../assets/favicon.png" type="image/png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../firebase-config.js"></script>

    <style>
        :root {
            --sigma-primary: #0B132B;
            --sigma-secondary: #1C2541;
            --sigma-accent: #10B981;
            --sigma-danger: #EF4444;
            --sigma-surface: #FFFFFF;
            --sigma-subtle: #F1F5F9;
            --text-heading: #0F172A;
            --text-body: #334155;
            --text-muted: #64748B;
            --input-border: #CBD5E1;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--sigma-subtle); color: var(--text-body); display: flex; min-height: 100vh; overflow-x: hidden; }

        /* Loading Overlay */
        #authOverlay {
            position: fixed; inset: 0; background: var(--sigma-primary); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; transition: opacity 0.4s;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.2);
            border-top-color: var(--sigma-accent); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Sidebar Navigation */
        .admin-sidebar {
            width: 260px; background: var(--sigma-primary); color: white; flex-shrink: 0;
            display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0;
            z-index: 100; transform: translateX(0); transition: transform 0.3s ease;
        }
        .sidebar-header { padding: 24px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 12px; }
        .sidebar-header img { width: 32px; height: 32px; background: white; border-radius: 8px; padding: 4px; }
        .sidebar-header h2 { font-size: 1.1rem; margin:0; }
        .nav-links { padding: 20px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; overflow-y: auto; }
        .nav-link {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            border-radius: var(--radius-md); color: rgba(255,255,255,0.7);
            text-decoration: none; font-weight: 600; font-size: 0.95rem; transition: var(--transition);
        }
        .nav-link:hover { background: rgba(255,255,255,0.1); color: white; }
        .nav-link.active { background: var(--sigma-accent); color: white; }
        .nav-link svg { width: 20px; height: 20px; }
        .logout-btn {
            margin: 20px 12px; background: rgba(239, 68, 68, 0.1); color: #FCA5A5;
            border: 1px solid rgba(239, 68, 68, 0.2); text-align: center; padding: 12px;
            border-radius: var(--radius-md); cursor: pointer; font-weight: 700; transition: var(--transition);
        }
        .logout-btn:hover { background: var(--sigma-danger); color: white; }

        /* Main Content */
        .admin-main { flex: 1; margin-left: 260px; display: flex; flex-direction: column; min-height: 100vh; }
        .topbar {
            height: 70px; background: var(--sigma-surface); border-bottom: 1px solid var(--input-border);
            display: flex; align-items: center; padding: 0 24px; justify-content: space-between;
            position: sticky; top: 0; z-index: 90;
        }
        .topbar h1 { font-size: 1.25rem; margin: 0; }
        .mobile-menu-btn { display: none; background: none; border: none; cursor: pointer; color: var(--text-heading); }
        
        .page-content { padding: 32px 24px; max-width: 1200px; width: 100%; margin: 0 auto; }

        /* Toolbar */
        .toolbar {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;
        }
        .btn-primary {
            background: var(--sigma-primary); color: white; border: none; padding: 12px 20px;
            border-radius: var(--radius-md); font-weight: 700; font-size: 0.95rem; cursor: pointer;
            display: flex; align-items: center; gap: 8px; transition: var(--transition);
        }
        .btn-primary:hover { background: var(--sigma-secondary); }

        /* Plans Grid */
        .plans-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;
        }

        .plan-card {
            background: var(--sigma-surface); border-radius: var(--radius-lg);
            padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            display: flex; flex-direction: column; position: relative; overflow: hidden;
            border: 1px solid var(--input-border);
        }
        .plan-card.inactive { opacity: 0.6; filter: grayscale(1); }

        .plan-header {
            display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px;
        }
        .plan-name { font-size: 1.15rem; font-weight: 800; color: var(--text-heading); }
        .plan-price { font-size: 1.25rem; font-weight: 900; color: var(--sigma-accent); }
        
        .plan-detail {
            display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 8px;
            border-bottom: 1px dashed var(--input-border); padding-bottom: 4px;
        }
        .plan-detail strong { color: var(--text-heading); }
        .plan-detail span { color: var(--text-muted); }

        .plan-actions {
            margin-top: 20px; display: flex; gap: 12px;
        }
        .btn-action {
            flex: 1; padding: 10px; border-radius: 6px; font-size: 0.85rem; font-weight: 600;
            cursor: pointer; border: 1px solid var(--input-border); background: none; transition: var(--transition);
        }
        .btn-action:hover { background: var(--sigma-subtle); }
        .btn-action.edit { color: var(--sigma-primary); border-color: var(--sigma-primary); }
        .btn-action.edit:hover { background: var(--sigma-primary); color: white; }

        /* Modals */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000;
            display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-content {
            background: white; width: 100%; max-width: 500px; border-radius: var(--radius-lg);
            padding: 24px; transform: scale(0.95); transition: transform 0.3s; max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.show .modal-content { transform: scale(1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-size: 1.25rem; }
        .close-modal { background: none; border: none; cursor: pointer; color: var(--text-muted); }

        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; color: var(--text-heading); }
        .form-input {
            width: 100%; padding: 12px 16px; border: 1px solid var(--input-border);
            border-radius: var(--radius-md); font-size: 0.95rem; outline: none; transition: var(--transition);
        }
        .form-input:focus { border-color: var(--sigma-accent); }
        
        .toggle-group {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; background: #F8FAFC; border-radius: var(--radius-md);
            margin-bottom: 16px; border: 1px solid var(--input-border);
        }
        .toggle-text { font-weight: 600; font-size: 0.9rem; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #CBD5E1; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--sigma-accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        @media (max-width: 768px) {
            .admin-sidebar { transform: translateX(-100%); }
            .admin-sidebar.open { transform: translateX(0); }
            .admin-main { margin-left: 0; }
            .mobile-menu-btn { display: block; }
            .page-content { padding: 20px 16px; }
        }
    </style>
</head>
<body>

    <!-- Auth Protection Overlay -->
    <div id="authOverlay">
        <div class="spinner"></div>
        <h2>Authorizing Admin...</h2>
    </div>

    <!-- Sidebar -->
    <aside class="admin-sidebar" id="sidebar">
        <div class="sidebar-header">
            <svg viewBox="0 0 24 24" style="width: 28px; fill: none; stroke: var(--sigma-accent); stroke-width: 2;">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <h2>Sigma Ops</h2>
        </div>
        <div class="nav-links">
            <a href="dashboard" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                Overview
            </a>
            <a href="users" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                User Management
            </a>
            <a href="plans" class="nav-link active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                Plans & Portfolios
            </a>
            <a href="content" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                UI & Content Config
            </a>
        </div>
        <button class="logout-btn" id="logoutBtn">Secure Logout</button>
    </aside>

    <!-- Main View -->
    <main class="admin-main">
        <header class="topbar">
            <div style="display:flex; align-items:center; gap: 16px;">
                <button class="mobile-menu-btn" id="menuBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <h1>Plans Management</h1>
            </div>
        </header>

        <div class="page-content">
            <div class="toolbar">
                <h2 style="font-size: 1.1rem; color: var(--text-heading);">Active & Inactive Portfolios</h2>
                <button class="btn-primary" id="createNewPlanBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    Create Plan
                </button>
            </div>

            <div class="plans-grid" id="plansContainer">
                <div style="grid-column: 1/-1; text-align:center; padding: 40px; color: var(--text-muted);">
                    Loading portfolios...
                </div>
            </div>
        </div>
    </main>

    <!-- Plan Editor Modal -->
    <div class="modal-overlay" id="planModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Create New Plan</h3>
                <button class="close-modal" id="closeModal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <form id="planForm">
                <input type="hidden" id="planId">
                <div class="form-group">
                    <label class="form-label">Plan Name</label>
                    <input type="text" id="pName" class="form-input" placeholder="e.g. Alpha Portfolio" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Investment Price (RS)</label>
                    <input type="number" id="pPrice" class="form-input" placeholder="5000" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Daily Return (RS)</label>
                    <input type="number" id="pDaily" class="form-input" placeholder="150" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Duration (Days)</label>
                    <input type="number" id="pDuration" class="form-input" placeholder="30" required>
                </div>
                <div class="toggle-group">
                    <div class="toggle-text">Status (Active = Visible to Users)</div>
                    <label class="switch">
                        <input type="checkbox" id="pStatus" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;" id="savePlanBtn">
                    Save Plan
                </button>
            </form>
        </div>
    </div>

    <script>
        const db = firebase.firestore();
        const auth = firebase.auth();
        let adminUser = null;
        let allPlans = [];

        const authOverlay = document.getElementById('authOverlay');
        const logoutBtn = document.getElementById('logoutBtn');
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const plansContainer = document.getElementById('plansContainer');
        
        // Modal elements
        const planModal = document.getElementById('planModal');
        const closeModal = document.getElementById('closeModal');
        const createNewPlanBtn = document.getElementById('createNewPlanBtn');
        const planForm = document.getElementById('planForm');
        
        // Form Inputs
        const planId = document.getElementById('planId');
        const pName = document.getElementById('pName');
        const pPrice = document.getElementById('pPrice');
        const pDaily = document.getElementById('pDaily');
        const pDuration = document.getElementById('pDuration');
        const pStatus = document.getElementById('pStatus');
        const savePlanBtn = document.getElementById('savePlanBtn');

        // Verify Admin Auth
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const doc = await db.collection('users').doc(user.uid).get();
                    if (doc.exists && (doc.data().role === 'admin' || doc.data().role === 'superadmin')) {
                        adminUser = user;
                        authOverlay.style.opacity = '0';
                        setTimeout(() => authOverlay.style.display = 'none', 400);
                        fetchPlans();
                    } else {
                        throw new Error("Unauthorized");
                    }
                } catch (e) {
                    auth.signOut();
                    window.location.replace('login.html');
                }
            } else {
                window.location.replace('login.html');
            }
        });

        // Fetch Plans
        function fetchPlans() {
            db.collection('plans').orderBy('price', 'asc').onSnapshot(snap => {
                allPlans = [];
                snap.forEach(doc => {
                    allPlans.push({ id: doc.id, ...doc.data() });
                });
                renderPlans();
            }, error => {
                console.error("Error fetching plans:", error);
                plansContainer.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:red;">Failed to load plans. Please check permissions.</div>`;
            });
        }

        // Render Plans
        function renderPlans() {
            if (allPlans.length === 0) {
                plansContainer.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px; color: var(--text-muted);">No plans found. Create one above.</div>`;
                return;
            }

            let html = '';
            allPlans.forEach(p => {
                const total = p.dailyROI * p.durationDays;
                const statusClass = p.status === 'active' ? '' : 'inactive';
                const statusBadge = p.status === 'active' ? 
                    `<span style="background:#ECFDF5; color:#059669; padding:4px 8px; border-radius:12px; font-size:0.75rem; font-weight:700;">Active</span>` : 
                    `<span style="background:#F1F5F9; color:#64748B; padding:4px 8px; border-radius:12px; font-size:0.75rem; font-weight:700;">Inactive</span>`;

                html += `
                <div class="plan-card ${statusClass}">
                    <div class="plan-header">
                        <div>
                            <div class="plan-name">${p.name}</div>
                            <div style="margin-top:4px;">${statusBadge}</div>
                        </div>
                        <div class="plan-price">RS ${p.price}</div>
                    </div>
                    <div class="plan-detail">
                        <span>Daily Return</span>
                        <strong>RS ${p.dailyROI}</strong>
                    </div>
                    <div class="plan-detail">
                        <span>Total Return</span>
                        <strong>RS ${total}</strong>
                    </div>
                    <div class="plan-detail" style="border:none; margin-bottom:0;">
                        <span>Duration</span>
                        <strong>${p.durationDays} Days</strong>
                    </div>
                    
                    <div class="plan-actions">
                        <button class="btn-action edit" onclick="editPlan('${p.id}')">Edit Plan</button>
                    </div>
                </div>
                `;
            });
            plansContainer.innerHTML = html;
        }

        // Open Modal for Create
        createNewPlanBtn.addEventListener('click', () => {
            planForm.reset();
            planId.value = '';
            pStatus.checked = true;
            document.getElementById('modalTitle').textContent = 'Create New Plan';
            planModal.classList.add('show');
        });

        // Open Modal for Edit
        window.editPlan = (id) => {
            const plan = allPlans.find(p => p.id === id);
            if (!plan) return;

            planId.value = plan.id;
            pName.value = plan.name;
            pPrice.value = plan.price;
            pDaily.value = plan.dailyROI;
            pDuration.value = plan.durationDays;
            pStatus.checked = plan.status === 'active';

            document.getElementById('modalTitle').textContent = 'Edit Plan';
            planModal.classList.add('show');
        };

        // Close Modal
        closeModal.addEventListener('click', () => {
            planModal.classList.remove('show');
        });

        // Save Plan
        planForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            savePlanBtn.disabled = true;
            savePlanBtn.textContent = 'Saving...';

            const payload = {
                name: pName.value.trim(),
                price: Number(pPrice.value),
                dailyROI: Number(pDaily.value),
                durationDays: Number(pDuration.value),
                status: pStatus.checked ? 'active' : 'inactive',
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                if (planId.value) {
                    // Update
                    await db.collection('plans').doc(planId.value).update(payload);
                } else {
                    // Create
                    payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection('plans').add(payload);
                }
                planModal.classList.remove('show');
            } catch (error) {
                console.error("Error saving plan:", error);
                alert("Failed to save plan. Please check your permissions.");
            }

            savePlanBtn.disabled = false;
            savePlanBtn.textContent = 'Save Plan';
        });

        // Logout
        logoutBtn.addEventListener('click', () => {
            auth.signOut();
        });

        // Mobile Menu
        menuBtn.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });
    </script>
</body>
</html>
