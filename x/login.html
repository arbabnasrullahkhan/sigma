<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sigma Ops | Admin Secure Login</title>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="theme-color" content="#0B132B">

    <link rel="shortcut icon" href="../assets/favicon.png" type="image/png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../firebase-config.js"></script>

    <style>
        /* ==========================================================================
           SIGMA ADMIN PREMIUM DESIGN TOKENS
           ========================================================================== */
        :root {
            --sigma-primary: #0B132B;
            --sigma-secondary: #1C2541;
            --sigma-accent: #10B981;
            --sigma-accent-dark: #059669;
            --sigma-danger: #EF4444;
            --sigma-surface: #FFFFFF;
            --text-heading: #0F172A;
            --text-body: #334155;
            --text-muted: #64748B;
            --input-border: #CBD5E1;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --transition: 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--sigma-primary);
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(16, 185, 129, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 85% 90%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-body);
        }

        /* Login Container optimized for Mobile (90% width up to 420px) */
        .login-container {
            width: 100%;
            max-width: 420px;
            background: var(--sigma-surface);
            border-radius: var(--radius-xl);
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--sigma-primary), var(--sigma-accent));
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .brand-logo-img {
            width: 42px;
            height: 42px;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .brand-text-img {
            height: 24px;
            object-fit: contain;
        }

        .login-header h1 {
            color: var(--text-heading);
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-heading);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            padding: 16px 16px 16px 44px;
            border: 1px solid var(--input-border);
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-heading);
            background: #F8FAFC;
            transition: var(--transition);
            outline: none;
        }

        .form-input:focus {
            border-color: var(--sigma-accent);
            background: white;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .form-input:focus ~ .input-icon {
            color: var(--sigma-accent);
        }

        .input-icon svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--sigma-primary), var(--sigma-secondary));
            color: white;
            border: none;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(11, 19, 43, 0.25);
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary:active {
            transform: scale(0.96);
            box-shadow: 0 4px 10px rgba(11, 19, 43, 0.2);
        }

        /* Error Banner */
        .error-banner {
            background: #FEF2F2;
            border: 1px solid #FCA5A5;
            color: #B91C1C;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: shake 0.4s ease;
        }

        .error-banner svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(4px);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .loading-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid var(--input-border);
            border-top-color: var(--sigma-accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        .loading-text {
            font-weight: 800;
            color: var(--sigma-primary);
            font-size: 1rem;
        }

        /* Animations */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        
        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <div class="loading-text" id="loadingText">Verifying Identity...</div>
        </div>

        <div class="login-header">
            <div class="brand-logos">
                <img src="../assets/logo.png" alt="Sigma" class="brand-logo-img">
                <img src="../assets/textlogo.png" alt="Sigma" class="brand-text-img">
            </div>
            <h1>Operational Access</h1>
            <p>Authorized Admin Control Center</p>
        </div>

        <div class="error-banner" id="errorBanner">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="errorMessage">Authentication failed.</span>
        </div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label class="form-label" for="email">Admin Email</label>
                <div class="input-wrapper">
                    <input type="email" id="email" class="form-input" placeholder="admin@sigma.com" required autocomplete="username">
                    <div class="input-icon">
                        <svg viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline stroke-linecap="round" stroke-linejoin="round" points="22,6 12,13 2,6"/></svg>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Security Key (Password)</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                    <div class="input-icon">
                        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke-linecap="round" stroke-linejoin="round"/><path stroke-linecap="round" stroke-linejoin="round" d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                    <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle Password Visibility">
                        <svg viewBox="0 0 24 24" id="eyeIcon">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-primary">
                Login to Dashboard
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('adminLoginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePassword');
        const eyeIcon = document.getElementById('eyeIcon');
        const errorBanner = document.getElementById('errorBanner');
        const errorMessage = document.getElementById('errorMessage');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');

        // Toggle Password
        togglePasswordBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23" stroke-linecap="round" stroke-linejoin="round"/>`;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorBanner.style.display = 'flex';
            loadingOverlay.classList.remove('active');
        }

        function showLoading(text = 'Authenticating...') {
            loadingText.textContent = text;
            loadingOverlay.classList.add('active');
            errorBanner.style.display = 'none';
        }

        // Firebase Setup & Auth Persistence
        if(typeof firebase !== 'undefined') {
            firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)
                .catch(error => console.error("Persistence error:", error));
        }

        // Admin Validation Function
        async function verifyAdminAccess(user) {
            showLoading("Verifying Admin Level...");
            try {
                const db = firebase.firestore();
                const userDoc = await db.collection('users').doc(user.uid).get();
                
                if (userDoc.exists) {
                    const userData = userDoc.data();
                    if (userData.role === 'admin' || userData.role === 'superadmin') {
                        window.location.replace('dashboard.html');
                        return;
                    }
                }
                
                await firebase.auth().signOut();
                showError("Access Denied: You do not have administrator privileges.");
                
            } catch (error) {
                console.error("Authorization check failed:", error);
                await firebase.auth().signOut();
                showError("Database connection failed. Please verify your internet.");
            }
        }

        // Auto-check on load if already logged in
        let isInitialLoad = true;
        firebase.auth().onAuthStateChanged((user) => {
            if (user && isInitialLoad) {
                verifyAdminAccess(user);
            } else {
                loadingOverlay.classList.remove('active');
                isInitialLoad = false;
            }
        });

        // Form Submit Handler
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            if (!email || !password) return;

            // =========================================================
            // SUPER ADMIN BYPASS / FAST LOGIN FOR SPECIFIC CREDENTIALS
            // =========================================================
            if (email === 'arbabnasru@gmail.com' && password === 'Sehwan@1234') {
                showLoading("Bypassing Firebase, accessing dashboard...");
                // Save a temporary session token to simulate login for debugging if needed
                sessionStorage.setItem('sigma_admin_bypass', 'true');
                setTimeout(() => {
                    window.location.replace('dashboard.html');
                }, 800);
                return;
            }

            // Normal Firebase Auth Flow
            showLoading("Establishing Secure Connection...");
            try {
                await firebase.auth().signInWithEmailAndPassword(email, password);
                // onAuthStateChanged takes over for verification
                verifyAdminAccess(firebase.auth().currentUser);
            } catch (error) {
                console.error("Login error:", error.code);
                let msg = "Authentication failed. Check your credentials.";
                if (error.code === 'auth/too-many-requests') {
                    msg = "Too many failed attempts. Try again later.";
                } else if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    msg = "Invalid email or security key.";
                }
                showError(msg);
            }
        });

    </script>
</body>
</html>
