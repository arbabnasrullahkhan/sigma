<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sigma Ops | Secure Admin Login</title>
    
    <!-- SEO & Security Meta -->
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#0B132B">

    <link rel="shortcut icon" href="../assets/favicon.png" type="image/png">
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- Centralized Firebase Config (Assumes this file is in a subfolder like /admin/ or /x/) -->
    <script src="../firebase-config.js"></script>

    <style>
        /* ==========================================================================
           1. SIGMA ADMIN DESIGN TOKENS
           ========================================================================== */
        :root {
            --sigma-primary: #0B132B;
            --sigma-secondary: #1C2541;
            --sigma-accent: #10B981;
            --sigma-accent-dark: #059669;
            --sigma-danger: #EF4444;
            --sigma-danger-soft: #FEE2E2;
            
            --bg-body: #050914; /* Deep secure dark background for admin login */
            --bg-surface: #FFFFFF;
            --bg-input: #F8FAFC;
            
            --text-main: #0F172A;
            --text-muted: #64748B;
            
            --border-light: #E2E8F0;
            --border-focus: #10B981;
            
            --radius-island: 28px;
            --radius-input: 16px;
            --radius-btn: 14px;
            
            --shadow-float: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 40px rgba(16, 185, 129, 0.15);
            
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ==========================================================================
           2. GLOBAL RESET & BASE
           ========================================================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.08) 0%, transparent 60vw),
                radial-gradient(circle at 50% 100%, rgba(59, 130, 246, 0.05) 0%, transparent 60vw);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Background Security Watermark */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('data:image/svg+xml;utf8,<svg opacity="0.02" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M0 0h100v100H0z" fill="none"/><path d="M0 10l10-10 10 10L10 20zM20 30l10-10 10 10-10 10z" fill="white"/></svg>');
            pointer-events: none;
            z-index: 0;
        }

        /* ==========================================================================
           3. LOGIN CARD
           ========================================================================== */
        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-surface);
            border-radius: var(--radius-island);
            padding: 40px 32px;
            box-shadow: var(--shadow-float), var(--shadow-glow);
            position: relative;
            z-index: 10;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Security Top Bar on Card */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--sigma-primary), var(--sigma-accent));
            border-radius: var(--radius-island) var(--radius-island) 0 0;
        }

        .header-wrap {
            text-align: center;
            margin-bottom: 32px;
        }

        .ops-logo {
            width: 64px; height: 64px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--sigma-primary), var(--sigma-secondary));
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            color: white;
            box-shadow: 0 10px 20px rgba(11, 19, 43, 0.3);
            border: 2px solid rgba(255,255,255,0.1);
        }

        .ops-logo svg {
            width: 32px; height: 32px;
            stroke: var(--sigma-accent);
            fill: none; stroke-width: 2;
        }

        .header-wrap h1 {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            color: var(--sigma-primary);
        }

        .header-wrap p {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ==========================================================================
           4. FORM CONTROLS (Floating Labels)
           ========================================================================== */
        .form-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border-radius: var(--radius-input);
            border: 1.5px solid var(--border-light);
            transition: var(--transition-smooth);
            overflow: hidden;
        }

        .input-wrapper:focus-within {
            background: var(--bg-surface);
            border-color: var(--sigma-accent);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
        }

        .input-wrapper.error {
            border-color: var(--sigma-danger);
            background: var(--sigma-danger-soft);
        }

        .input-icon {
            width: 52px;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted);
            transition: var(--transition-smooth);
            flex-shrink: 0;
        }

        .input-wrapper:focus-within .input-icon { color: var(--sigma-accent); }
        .input-wrapper.error .input-icon { color: var(--sigma-danger); }

        .input-icon svg {
            width: 20px; height: 20px;
            stroke: currentColor; stroke-width: 2; fill: none;
        }

        .input-field {
            flex: 1;
            height: 60px;
            padding: 22px 16px 6px 0;
            font-size: 1rem;
            color: var(--text-main);
            font-weight: 600;
        }

        .input-field::placeholder { color: transparent; }

        .floating-label {
            position: absolute;
            left: 52px; top: 19px;
            font-size: 0.95rem;
            color: var(--text-muted);
            pointer-events: none;
            transition: 0.2s ease all;
            font-weight: 500;
        }

        .input-field:focus ~ .floating-label,
        .input-field:not(:placeholder-shown) ~ .floating-label {
            top: 7px;
            font-size: 0.7rem;
            color: var(--sigma-accent);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper.error .floating-label { color: var(--sigma-danger); }

        .trailing-action {
            width: 52px; height: 60px;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted);
            transition: var(--transition-smooth);
        }

        .trailing-action:hover { color: var(--sigma-primary); }

        .trailing-action svg {
            width: 20px; height: 20px;
            stroke: currentColor; stroke-width: 2; fill: none;
        }

        /* Error Banner */
        .error-banner {
            background: var(--sigma-danger-soft);
            color: var(--sigma-danger-dark);
            padding: 12px 16px;
            border-radius: var(--radius-btn);
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            animation: shake 0.4s ease;
        }
        .error-banner svg { width: 18px; height: 18px; flex-shrink: 0; }

        /* Tools Row */
        .tools-row {
            display: flex;
            justify-content: flex-end;
            margin-top: -8px;
            margin-bottom: 24px;
            padding: 0 4px;
        }

        .forgot-link {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--sigma-primary);
            transition: var(--transition-fast);
        }
        .forgot-link:hover { color: var(--sigma-accent); text-decoration: underline; }

        /* Buttons */
        .btn-submit {
            width: 100%;
            height: 56px;
            border-radius: var(--radius-input);
            background: linear-gradient(135deg, var(--sigma-primary), var(--sigma-secondary));
            color: white;
            font-size: 1.05rem;
            font-weight: 800;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.25);
            transition: var(--transition-bounce);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(15, 23, 42, 0.35);
        }

        .btn-submit:active:not(:disabled) { transform: scale(0.98); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

        /* Full Screen Loading Overlay for Auth Check */
        .auth-overlay {
            position: fixed;
            inset: 0;
            background: var(--sigma-primary);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            transition: opacity 0.4s ease;
            opacity: 0;
            visibility: hidden;
        }

        .auth-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .spinner-large {
            width: 48px; height: 48px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--sigma-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        .auth-overlay h2 {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        .auth-overlay p {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.6);
            font-family: 'JetBrains Mono', monospace;
        }

        .spinner-small {
            width: 22px; height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        .btn-submit.loading .spinner-small { display: block; }
        .btn-submit.loading span, .btn-submit.loading svg { display: none; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
                border-radius: 24px;
            }
        }
    </style>
</head>
<body>

    <!-- SVG SPRITES -->
    <svg width="0" height="0" style="display:none;" aria-hidden="true">
        <symbol id="icon-shield" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
        </symbol>
        <symbol id="icon-mail" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
            <polyline stroke-linecap="round" stroke-linejoin="round" points="22,6 12,13 2,6" />
        </symbol>
        <symbol id="icon-lock" viewBox="0 0 24 24">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke-linecap="round" stroke-linejoin="round" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 11V7a5 5 0 0 1 10 0v4" />
        </symbol>
        <symbol id="icon-eye" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
            <circle cx="12" cy="12" r="3" />
        </symbol>
        <symbol id="icon-eye-off" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
            <line x1="1" y1="1" x2="23" y2="23" />
        </symbol>
        <symbol id="icon-alert" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="12" y1="8" x2="12" y2="12" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="12" y1="16" x2="12.01" y2="16" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>
        <symbol id="icon-arrow-right" viewBox="0 0 24 24">
            <line x1="5" y1="12" x2="19" y2="12" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="12 5 19 12 12 19" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>
    </svg>

    <!-- Global Fullscreen Loader -->
    <div class="auth-overlay active" id="authOverlay">
        <div class="spinner-large"></div>
        <h2 id="overlayTitle">Initializing Core</h2>
        <p id="overlaySub">Establishing secure connection...</p>
    </div>

    <!-- Login Container -->
    <main class="login-card">
        <div class="header-wrap">
            <div class="ops-logo">
                <svg><use href="#icon-shield"/></svg>
            </div>
            <h1>Sigma Operations</h1>
            <p>Secure Administrator Portal</p>
        </div>

        <div class="error-banner" id="errorBanner">
            <svg><use href="#icon-alert"/></svg>
            <span id="errorMessage">Authentication failed.</span>
        </div>

        <form id="adminLoginForm" novalidate>
            <!-- Email -->
            <div class="form-group">
                <div class="input-wrapper" id="wrapEmail">
                    <div class="input-icon"><svg><use href="#icon-mail"/></svg></div>
                    <input type="email" id="email" class="input-field" placeholder=" " autocomplete="username" required>
                    <label class="floating-label">Admin Email</label>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <div class="input-wrapper" id="wrapPassword">
                    <div class="input-icon"><svg><use href="#icon-lock"/></svg></div>
                    <input type="password" id="password" class="input-field" placeholder=" " autocomplete="current-password" required>
                    <label class="floating-label">Security Key</label>
                    <button type="button" class="trailing-action" id="togglePassword" aria-label="Toggle password">
                        <svg id="eyeIcon"><use href="#icon-eye"/></svg>
                    </button>
                </div>
            </div>

            <div class="tools-row">
                <a href="#" class="forgot-link" id="forgotPwdBtn">Reset Credentials?</a>
            </div>

            <button type="submit" class="btn-submit" id="loginBtn">
                <span>Authorize Access</span>
                <svg style="width:20px;height:20px;stroke:white;fill:none;stroke-width:2.5;"><use href="#icon-arrow-right"/></svg>
                <div class="spinner-small"></div>
            </button>
        </form>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            // DOM Elements
            const form = document.getElementById('adminLoginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const wrapEmail = document.getElementById('wrapEmail');
            const wrapPassword = document.getElementById('wrapPassword');
            const togglePwdBtn = document.getElementById('togglePassword');
            const eyeIcon = document.getElementById('eyeIcon');
            const loginBtn = document.getElementById('loginBtn');
            const forgotPwdBtn = document.getElementById('forgotPwdBtn');
            const errorBanner = document.getElementById('errorBanner');
            const errorMessage = document.getElementById('errorMessage');
            
            const authOverlay = document.getElementById('authOverlay');
            const overlayTitle = document.getElementById('overlayTitle');
            const overlaySub = document.getElementById('overlaySub');

            // --- UI Functions ---
            
            const showError = (msg, targetWrap = null) => {
                errorMessage.textContent = msg;
                errorBanner.style.display = 'flex';
                
                // Shake Animation Reset
                errorBanner.classList.remove('shake');
                void errorBanner.offsetWidth; 
                errorBanner.classList.add('shake');

                if (targetWrap) targetWrap.classList.add('error');
            };

            const clearErrors = () => {
                errorBanner.style.display = 'none';
                wrapEmail.classList.remove('error');
                wrapPassword.classList.remove('error');
            };

            const showFullscreenLoading = (title, sub) => {
                overlayTitle.textContent = title;
                overlaySub.textContent = sub;
                authOverlay.classList.add('active');
            };

            const hideFullscreenLoading = () => {
                authOverlay.classList.remove('active');
            };

            // Password Toggle Logic
            togglePwdBtn.addEventListener('click', () => {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                eyeIcon.innerHTML = isPassword ? '<use href="#icon-eye-off"/>' : '<use href="#icon-eye"/>';
                passwordInput.focus();
            });

            emailInput.addEventListener('input', clearErrors);
            passwordInput.addEventListener('input', clearErrors);

            // --- Firebase Logic ---

            const isFirebaseReady = () => typeof firebase !== 'undefined' && firebase.apps.length > 0;

            // 1. Initial Session Check (Protects login page if already an admin)
            const initSessionCheck = () => {
                if (!isFirebaseReady()) {
                    showError("Firebase configuration missing. Check network.");
                    hideFullscreenLoading();
                    return;
                }

                // Set secure persistence
                firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(console.error);

                firebase.auth().onAuthStateChanged(async (user) => {
                    if (user) {
                        showFullscreenLoading("Verifying Credentials", "Checking security clearance...");
                        await verifyAdminRole(user, false);
                    } else {
                        // Not logged in, reveal form
                        hideFullscreenLoading();
                    }
                });
            };

            // 2. Core Admin Role Verification (Queries Firestore)
            const verifyAdminRole = async (user, isManualLogin = false) => {
                try {
                    const db = firebase.firestore();
                    const doc = await db.collection('users').doc(user.uid).get();
                    
                    if (doc.exists) {
                        const role = doc.data().role;
                        // Strict check for admin or superadmin
                        if (role === 'admin' || role === 'superadmin') {
                            overlaySub.textContent = "Clearance granted. Redirecting...";
                            setTimeout(() => {
                                window.location.replace('dashboard.html'); // Redirect to step 2 file
                            }, 500);
                            return;
                        }
                    }
                    
                    // Unauthorized Action
                    await firebase.auth().signOut();
                    hideFullscreenLoading();
                    showError("Access Denied: Administrator privileges required.", wrapEmail);
                    
                } catch (error) {
                    console.error("Verification failed:", error);
                    await firebase.auth().signOut();
                    hideFullscreenLoading();
                    showError("Security verification failed. Please try again.");
                }
            };

            // 3. Handle Form Submission
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearErrors();

                const email = emailInput.value.trim();
                const pwd = passwordInput.value;

                if (!email) return showError("Please enter your admin email.", wrapEmail);
                if (!pwd) return showError("Please enter your security key.", wrapPassword);

                // Start button loading state
                loginBtn.classList.add('loading');
                loginBtn.disabled = true;

                try {
                    // Sign In
                    const userCred = await firebase.auth().signInWithEmailAndPassword(email, pwd);
                    
                    // Success UI transition
                    loginBtn.classList.remove('loading');
                    loginBtn.innerHTML = `<span><svg style="width:20px;height:20px;stroke:white;fill:none;stroke-width:2.5;"><use href="#icon-check"></use></svg> Authenticated</span>`;
                    loginBtn.style.background = 'var(--sigma-accent)';
                    
                    // Trigger fullscreen role check
                    showFullscreenLoading("Authenticating", "Fetching security clearance level...");
                    await verifyAdminRole(userCred.user, true);

                } catch (error) {
                    loginBtn.classList.remove('loading');
                    loginBtn.disabled = false;
                    
                    let msg = "Authentication failed. Please check credentials.";
                    if (error.code === 'auth/too-many-requests') {
                        msg = "Too many failed attempts. Device locked temporarily.";
                    } else if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                        msg = "Invalid email or security key.";
                        wrapPassword.classList.add('error');
                    } else if (error.code === 'auth/network-request-failed') {
                        msg = "Network error. Connection to secure server failed.";
                    }
                    showError(msg);
                }
            });

            // 4. Password Reset Logic
            forgotPwdBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                clearErrors();
                
                const email = emailInput.value.trim();
                if (!email) {
                    showError("Enter your admin email address first to send a reset link.", wrapEmail);
                    emailInput.focus();
                    return;
                }

                showFullscreenLoading("Sending Reset Protocol", "Please wait...");
                try {
                    await firebase.auth().sendPasswordResetEmail(email);
                    hideFullscreenLoading();
                    
                    errorBanner.style.backgroundColor = 'var(--sigma-accent-soft)';
                    errorBanner.style.borderColor = 'var(--border-focus)';
                    errorBanner.style.color = 'var(--sigma-accent-dark)';
                    errorBanner.innerHTML = `<svg style="stroke:currentColor;fill:none;stroke-width:2.5;"><use href="#icon-check"/></svg><span>Recovery email dispatched to ${email}.</span>`;
                    errorBanner.style.display = 'flex';
                    
                } catch (error) {
                    hideFullscreenLoading();
                    console.error("Reset error:", error);
                    // Revert colors to danger if they were changed
                    errorBanner.style.backgroundColor = 'var(--sigma-danger-soft)';
                    errorBanner.style.borderColor = 'rgba(239, 68, 68, 0.3)';
                    errorBanner.style.color = 'var(--sigma-danger-dark)';
                    showError("Failed to send recovery email. Ensure address is correct.", wrapEmail);
                }
            });

            // Boot
            setTimeout(initSessionCheck, 500);
        });
    </script>
</body>
</html>
