<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sigma Ops | Admin Secure Login</title>
    
    <!-- SEO & Indexing (Blocked for Admin Panel) -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="theme-color" content="#0B132B">

    <!-- Favicon -->
    <link rel="shortcut icon" href="../assets/favicon.png" type="image/png">
    
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <!-- Firebase Configuration -->
    <script src="../firebase-config.js"></script>

    <style>
        /* ==========================================================================
           SIGMA ADMIN DESIGN TOKENS
           ========================================================================== */
        :root {
            --sigma-primary: #0B132B;
            --sigma-secondary: #1C2541;
            --sigma-accent: #10B981;
            --sigma-accent-dark: #059669;
            --sigma-danger: #EF4444;
            --sigma-danger-bg: #FEF2F2;
            --sigma-surface: #FFFFFF;
            --sigma-input-bg: #F8FAFC;
            
            --text-heading: #0F172A;
            --text-body: #334155;
            --text-muted: #64748B;
            
            --border-color: #CBD5E1;
            --border-focus: #10B981;
            
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--sigma-primary);
            background-image: 
                radial-gradient(circle at 80% 20%, rgba(16, 185, 129, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-body);
            overflow: hidden;
        }

        /* ==========================================================================
           MAIN LOGIN CARD (MOBILE OPTIMIZED)
           ========================================================================== */
        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--sigma-surface);
            border-radius: var(--radius-xl);
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
            animation: slideUp 0.6s ease-out;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
                border-radius: var(--radius-lg);
            }
        }

        /* Branding Header */
        .login-header {
            text-align: center;
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .brand-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            background: var(--sigma-input-bg);
            padding: 12px 24px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .brand-logos img.logo-icon {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .brand-logos img.logo-text {
            height: 22px;
            object-fit: contain;
        }

        .login-header h1 {
            color: var(--text-heading);
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* Error Banner */
        .error-banner {
            background: var(--sigma-danger-bg);
            border: 1px solid #FCA5A5;
            color: #B91C1C;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 24px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: shake 0.4s ease;
        }

        .error-banner svg {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        /* Forms */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-heading);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-heading);
            background: var(--sigma-input-bg);
            transition: var(--transition);
            outline: none;
        }

        .form-input:focus {
            border-color: var(--sigma-accent);
            background: white;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        /* Password Toggle */
        .password-toggle {
            position: absolute;
            right: 16px;
            top: 40px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .password-toggle:hover {
            color: var(--sigma-primary);
        }

        .password-toggle svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* Forgot Password */
        .form-options {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 28px;
        }

        .forgot-link {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--sigma-accent-dark);
            text-decoration: none;
            transition: var(--transition);
        }

        .forgot-link:hover {
            color: var(--sigma-primary);
            text-decoration: underline;
        }

        /* Submit Button */
        .btn-primary {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--sigma-primary), var(--sigma-secondary));
            color: white;
            border: none;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(11, 19, 43, 0.25);
        }

        .btn-primary:active {
            transform: scale(0.97);
            box-shadow: 0 4px 10px rgba(11, 19, 43, 0.15);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Loading Spinner inside Button */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .btn-primary.loading .spinner { display: block; }
        .btn-primary.loading span, .btn-primary.loading svg { display: none; }

        /* Full Screen Loader */
        .page-loader {
            position: fixed;
            inset: 0;
            background: var(--sigma-primary);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s ease;
            color: white;
        }

        .page-loader.active {
            opacity: 1;
            visibility: visible;
        }

        .page-loader .large-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(16, 185, 129, 0.2);
            border-top-color: var(--sigma-accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        /* Animations */
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
    </style>
</head>
<body>

    <!-- Full Screen Preloader (For Auth State Checks) -->
    <div class="page-loader" id="pageLoader">
        <div class="large-spinner"></div>
        <h3 id="loaderText" style="font-weight: 700; letter-spacing: 1px;">Verifying Secure Session...</h3>
    </div>

    <!-- Login UI Card -->
    <div class="login-card">
        
        <div class="login-header">
            <!-- Brand Logos from your assets -->
            <div class="brand-logos">
                <img src="../assets/logo.png" alt="Sigma Icon" class="logo-icon" onerror="this.style.display='none'">
                <img src="../assets/textlogo.png" alt="SIGMA" class="logo-text" onerror="this.style.display='none'">
            </div>
            <h1>Admin Control Panel</h1>
            <p>Authorized personnel only.</p>
        </div>

        <div class="error-banner" id="errorBanner">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span id="errorMessage">Authentication failed.</span>
        </div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label class="form-label" for="email">Administrator Email</label>
                <input type="email" id="email" class="form-input" placeholder="admin@sigma.com" required autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Secure Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle Password">
                    <svg viewBox="0 0 24 24" id="eyeIcon">
                        <!-- Default: Eye Icon (Hide) -->
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </button>
            </div>

            <div class="form-options">
                <a href="#" class="forgot-link" id="forgotPasswordBtn">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-primary" id="loginBtn">
                <span>Access Terminal</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
                <div class="spinner"></div>
            </button>
        </form>
    </div>

    <!-- ==========================================================================
         JAVASCRIPT LOGIC (Firebase Auth & Custom UID Validation)
         ========================================================================== -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // DOM Elements
            const form = document.getElementById('adminLoginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('togglePassword');
            const eyeIcon = document.getElementById('eyeIcon');
            const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');
            const errorBanner = document.getElementById('errorBanner');
            const errorMessage = document.getElementById('errorMessage');
            const loginBtn = document.getElementById('loginBtn');
            const pageLoader = document.getElementById('pageLoader');
            const loaderText = document.getElementById('loaderText');

            // Specific Admin UID requested
            const MASTER_ADMIN_UID = "9NQHVzL4KiSVUoaGf63BcmCGMDa2";

            // Setup Persistence
            firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL)
                .catch(err => console.error("Persistence error:", err));

            // UI Helpers
            const showError = (msg) => {
                errorMessage.textContent = msg;
                errorBanner.style.display = 'flex';
                // Trigger shake animation by re-adding the element class
                errorBanner.classList.remove('shake');
                void errorBanner.offsetWidth; 
                errorBanner.style.animation = 'shake 0.4s ease';
                hideLoader();
                
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            };

            const hideError = () => {
                errorBanner.style.display = 'none';
            };

            const showLoader = (text = "Verifying...") => {
                loaderText.textContent = text;
                pageLoader.classList.add('active');
            };

            const hideLoader = () => {
                pageLoader.classList.remove('active');
            };

            // Toggle Password View
            togglePasswordBtn.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />`;
                } else {
                    passwordInput.type = 'password';
                    eyeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
                }
            });

            // Clear errors on input
            emailInput.addEventListener('input', hideError);
            passwordInput.addEventListener('input', hideError);

            // =========================================================
            // AUTHORIZATION LOGIC
            // =========================================================
            async function verifyAdminAccess(user) {
                showLoader("Authenticating Credentials...");
                try {
                    const db = firebase.firestore();
                    let isAuthorized = false;

                    // 1. Check Master UID (Highest Priority)
                    if (user.uid === MASTER_ADMIN_UID) {
                        isAuthorized = true;
                    } 
                    // 2. Check Firestore Role
                    else {
                        const userDoc = await db.collection('users').doc(user.uid).get();
                        if (userDoc.exists) {
                            const role = userDoc.data().role;
                            if (role === 'admin' || role === 'superadmin') {
                                isAuthorized = true;
                            }
                        }
                    }

                    // 3. Action based on Authorization
                    if (isAuthorized) {
                        // Success! Proceed to dashboard
                        window.location.replace('dashboard.html');
                    } else {
                        // Reject and Sign Out
                        await firebase.auth().signOut();
                        showError("Access Denied: You do not have administrator permissions.");
                    }
                } catch (error) {
                    console.error("Verification Error:", error);
                    await firebase.auth().signOut();
                    showError("Database connection failed. Contact system administrator.");
                }
            }

            // Global Auth Listener (Checks session on page load)
            let isInitialLoad = true;
            firebase.auth().onAuthStateChanged((user) => {
                if (user) {
                    verifyAdminAccess(user);
                } else {
                    if (isInitialLoad) {
                        hideLoader(); // Show login form
                        isInitialLoad = false;
                    }
                }
            });
            
            // Show loader instantly on boot until Auth state returns
            if (isInitialLoad) showLoader("Initializing System...");

            // =========================================================
            // FORM SUBMISSION (LOGIN)
            // =========================================================
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideError();

                const email = emailInput.value.trim();
                const password = passwordInput.value;
                
                if (!email || !password) return;

                loginBtn.classList.add('loading');
                loginBtn.disabled = true;

                try {
                    // Firebase Sign In
                    await firebase.auth().signInWithEmailAndPassword(email, password);
                    // The onAuthStateChanged listener above will automatically trigger verifyAdminAccess()
                } catch (error) {
                    let msg = "Authentication failed. Please check your credentials.";
                    if (error.code === 'auth/too-many-requests') {
                        msg = "Security Lock: Too many failed attempts. Try again later.";
                    } else if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                        msg = "Invalid email or password provided.";
                    } else if (error.code === 'auth/network-request-failed') {
                        msg = "Network Error: Please check your internet connection.";
                    }
                    showError(msg);
                }
            });

            // =========================================================
            // FORGOT PASSWORD
            // =========================================================
            forgotPasswordBtn.addEventListener('click', async (e) => {
                e.preventDefault();
                hideError();

                const email = emailInput.value.trim();
                if (!email) {
                    showError("Please enter your admin email to reset password.");
                    emailInput.focus();
                    return;
                }

                loginBtn.classList.add('loading');
                loginBtn.disabled = true;

                try {
                    await firebase.auth().sendPasswordResetEmail(email);
                    
                    // Show Success in Banner
                    errorBanner.style.backgroundColor = 'var(--sigma-accent-soft)';
                    errorBanner.style.borderColor = 'var(--sigma-accent-border)';
                    errorBanner.style.color = 'var(--sigma-accent-dark)';
                    errorBanner.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg><span>Password reset instructions sent to your email.</span>`;
                    errorBanner.style.display = 'flex';
                    
                } catch (error) {
                    console.error("Reset error:", error);
                    errorBanner.style.backgroundColor = 'var(--sigma-danger-bg)';
                    errorBanner.style.borderColor = '#FCA5A5';
                    errorBanner.style.color = '#B91C1C';
                    showError("Failed to send reset email. Ensure the email address is correct.");
                } finally {
                    loginBtn.classList.remove('loading');
                    loginBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
