<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sigma Admin | Payment Verification</title>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="theme-color" content="#0B132B">

    <link rel="shortcut icon" href="../assets/favicon.png" type="image/png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../firebase-config.js"></script>

    <style>
        :root {
            --sigma-primary: #0B132B;
            --sigma-secondary: #1C2541;
            --sigma-accent: #10B981;
            --sigma-danger: #EF4444;
            --sigma-surface: #FFFFFF;
            --sigma-subtle: #F1F5F9;
            --text-heading: #0F172A;
            --text-body: #334155;
            --text-muted: #64748B;
            --input-border: #CBD5E1;
            --radius-md: 12px;
            --radius-lg: 16px;
            --transition: 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--sigma-subtle); color: var(--text-body); display: flex; min-height: 100vh; overflow-x: hidden; }

        /* Loading Overlay */
        #authOverlay {
            position: fixed; inset: 0; background: var(--sigma-primary); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; transition: opacity 0.4s;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.2);
            border-top-color: var(--sigma-accent); border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Sidebar Navigation */
        .admin-sidebar {
            width: 260px; background: var(--sigma-primary); color: white; flex-shrink: 0;
            display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0;
            z-index: 100; transform: translateX(0); transition: transform 0.3s ease;
        }
        .sidebar-header { padding: 24px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 12px; }
        .sidebar-header img { width: 32px; height: 32px; background: white; border-radius: 8px; padding: 4px; }
        .sidebar-header h2 { font-size: 1.1rem; margin:0; }
        .nav-links { padding: 20px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; overflow-y: auto; }
        .nav-link {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            border-radius: var(--radius-md); color: rgba(255,255,255,0.7);
            text-decoration: none; font-weight: 600; font-size: 0.95rem; transition: var(--transition);
        }
        .nav-link:hover { background: rgba(255,255,255,0.1); color: white; }
        .nav-link.active { background: var(--sigma-accent); color: white; }
        .nav-link svg { width: 20px; height: 20px; }
        .logout-btn {
            margin: 20px 12px; background: rgba(239, 68, 68, 0.1); color: #FCA5A5;
            border: 1px solid rgba(239, 68, 68, 0.2); text-align: center; padding: 12px;
            border-radius: var(--radius-md); cursor: pointer; font-weight: 700; transition: var(--transition);
        }
        .logout-btn:hover { background: var(--sigma-danger); color: white; }

        /* Main Content */
        .admin-main { flex: 1; margin-left: 260px; display: flex; flex-direction: column; min-height: 100vh; }
        .topbar {
            height: 70px; background: var(--sigma-surface); border-bottom: 1px solid var(--input-border);
            display: flex; align-items: center; padding: 0 24px; justify-content: space-between;
            position: sticky; top: 0; z-index: 90;
        }
        .topbar h1 { font-size: 1.25rem; margin: 0; }
        .mobile-menu-btn { display: none; background: none; border: none; cursor: pointer; color: var(--text-heading); }
        
        .page-content { padding: 32px 24px; max-width: 1200px; width: 100%; margin: 0 auto; }

        /* Tabs */
        .tabs { display: flex; gap: 12px; margin-bottom: 24px; }
        .tab-btn {
            padding: 10px 20px; border-radius: var(--radius-pill); font-weight: 600; font-size: 0.9rem;
            cursor: pointer; transition: var(--transition); background: var(--sigma-surface);
            border: 1px solid var(--input-border); color: var(--text-body);
        }
        .tab-btn.active { background: var(--sigma-primary); color: white; border-color: var(--sigma-primary); }

        /* Table */
        .table-container {
            background: var(--sigma-surface); border-radius: var(--radius-lg);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 16px 20px; border-bottom: 1px solid var(--input-border); }
        th { background: #F8FAFC; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        td { font-size: 0.9rem; font-weight: 500; }
        tbody tr:hover { background: #F8FAFC; }

        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .badge.pending { background: #FEF3C7; color: #D97706; }
        .badge.approved { background: #ECFDF5; color: #059669; }
        .badge.rejected { background: #FEF2F2; color: #DC2626; }

        .btn-review {
            background: var(--sigma-primary); color: white; border: none; padding: 8px 16px;
            border-radius: 6px; font-weight: 600; cursor: pointer; transition: var(--transition);
        }
        .btn-review:hover { background: var(--sigma-secondary); }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000;
            display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal-content {
            background: white; width: 100%; max-width: 600px; border-radius: var(--radius-lg);
            padding: 24px; transform: scale(0.95); transition: transform 0.3s; max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.show .modal-content { transform: scale(1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-size: 1.25rem; }
        .close-modal { background: none; border: none; cursor: pointer; color: var(--text-muted); }

        .proof-img-container {
            width: 100%; height: 300px; background: var(--sigma-subtle); border-radius: var(--radius-md);
            margin-bottom: 20px; display: flex; align-items: center; justify-content: center; overflow: hidden;
            border: 1px solid var(--input-border);
        }
        .proof-img-container img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .detail-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;
        }
        .detail-box {
            background: #F8FAFC; padding: 12px; border-radius: 8px; border: 1px solid var(--input-border);
        }
        .detail-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
        .detail-value { font-size: 0.95rem; font-weight: 600; color: var(--text-heading); word-break: break-all; }

        .action-group { display: flex; gap: 12px; margin-top: 16px; }
        .btn-approve { flex: 1; background: var(--sigma-accent); color: white; border: none; padding: 14px; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; }
        .btn-reject { flex: 1; background: white; color: var(--sigma-danger); border: 1px solid var(--sigma-danger); padding: 14px; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; }
        
        .btn-approve:disabled, .btn-reject:disabled { opacity: 0.5; cursor: not-allowed; }

        .reject-reason-box {
            margin-top: 12px; display: none;
        }
        .reject-reason-box input {
            width: 100%; padding: 12px; border: 1px solid var(--sigma-danger); border-radius: var(--radius-md);
            margin-bottom: 12px; font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .admin-sidebar { transform: translateX(-100%); }
            .admin-sidebar.open { transform: translateX(0); }
            .admin-main { margin-left: 0; }
            .mobile-menu-btn { display: block; }
            .page-content { padding: 20px 16px; }
            .detail-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Auth Protection Overlay -->
    <div id="authOverlay">
        <div class="spinner"></div>
        <h2>Authorizing Admin...</h2>
    </div>

    <!-- Sidebar -->
    <aside class="admin-sidebar" id="sidebar">
        <div class="sidebar-header">
            <svg viewBox="0 0 24 24" style="width: 28px; fill: none; stroke: var(--sigma-accent); stroke-width: 2;">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <h2>Sigma Ops</h2>
        </div>
        <div class="nav-links">
            <a href="dashboard" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                Overview
            </a>
            <a href="users" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                User Management
            </a>
            <a href="plans" class="nav-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                Plans & Portfolios
            </a>
            <a href="deposits" class="nav-link active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                Deposits / Payments
            </a>
        </div>
        <button class="logout-btn" id="logoutBtn">Secure Logout</button>
    </aside>

    <!-- Main View -->
    <main class="admin-main">
        <header class="topbar">
            <div style="display:flex; align-items:center; gap: 16px;">
                <button class="mobile-menu-btn" id="menuBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <h1>Payment Verifications</h1>
            </div>
        </header>

        <div class="page-content">
            <div class="tabs">
                <button class="tab-btn active" id="tabPending">Pending Reviews</button>
                <button class="tab-btn" id="tabHistory">History</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Request ID</th>
                            <th>Plan / Method</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="6" style="text-align:center; padding:32px;">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Review Modal -->
    <div class="modal-overlay" id="reviewModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Review Payment</h3>
                <button class="close-modal" id="closeModal">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            
            <div class="proof-img-container">
                <img id="mProofImg" src="" alt="Payment Proof">
            </div>

            <div class="detail-grid">
                <div class="detail-box">
                    <div class="detail-label">User UID</div>
                    <div class="detail-value" id="mUid"></div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">Transaction ID (TID)</div>
                    <div class="detail-value" id="mTid" style="font-family: monospace; font-size:1.1rem; color:var(--sigma-primary);"></div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">Amount Paid</div>
                    <div class="detail-value" id="mAmount"></div>
                </div>
                <div class="detail-box">
                    <div class="detail-label">Target Plan</div>
                    <div class="detail-value" id="mPlan"></div>
                </div>
            </div>

            <div class="reject-reason-box" id="rejectBox">
                <input type="text" id="rejectReason" placeholder="Enter reason for rejection (e.g. Invalid TID)">
                <button class="btn-reject" id="confirmRejectBtn" style="width: 100%;">Confirm Rejection</button>
            </div>

            <div class="action-group" id="actionGroup">
                <button class="btn-approve" id="approveBtn">Approve Deposit</button>
                <button class="btn-reject" id="rejectBtn">Reject</button>
            </div>
        </div>
    </div>

    <script>
        const db = firebase.firestore();
        const auth = firebase.auth();
        let adminUser = null;
        let allRequests = [];
        let currentFilter = 'pending_verification';
        let activeRequest = null;

        const authOverlay = document.getElementById('authOverlay');
        const logoutBtn = document.getElementById('logoutBtn');
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const tableBody = document.getElementById('tableBody');
        
        // Tabs
        const tabPending = document.getElementById('tabPending');
        const tabHistory = document.getElementById('tabHistory');

        // Modal
        const reviewModal = document.getElementById('reviewModal');
        const closeModal = document.getElementById('closeModal');
        const actionGroup = document.getElementById('actionGroup');
        const rejectBox = document.getElementById('rejectBox');

        // Verify Admin Auth
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const doc = await db.collection('users').doc(user.uid).get();
                    if (doc.exists && (doc.data().role === 'admin' || doc.data().role === 'superadmin')) {
                        adminUser = user;
                        authOverlay.style.opacity = '0';
                        setTimeout(() => authOverlay.style.display = 'none', 400);
                        fetchRequests();
                    } else {
                        throw new Error("Unauthorized");
                    }
                } catch (e) {
                    auth.signOut();
                    window.location.replace('login.html');
                }
            } else {
                window.location.replace('login.html');
            }
        });

        // Tabs Logic
        tabPending.addEventListener('click', () => {
            tabPending.classList.add('active'); tabHistory.classList.remove('active');
            currentFilter = 'pending_verification';
            renderTable();
        });
        tabHistory.addEventListener('click', () => {
            tabHistory.classList.add('active'); tabPending.classList.remove('active');
            currentFilter = 'history';
            renderTable();
        });

        // Fetch Data
        function fetchRequests() {
            db.collection('payment_requests').orderBy('createdAt', 'desc').onSnapshot(snap => {
                allRequests = [];
                snap.forEach(doc => {
                    allRequests.push({ id: doc.id, ...doc.data() });
                });
                renderTable();
            }, error => {
                console.error("Error fetching requests:", error);
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">Failed to load data.</td></tr>`;
            });
        }

        function renderTable() {
            let filtered = [];
            if (currentFilter === 'pending_verification') {
                filtered = allRequests.filter(r => r.status === 'pending_verification');
            } else {
                filtered = allRequests.filter(r => r.status !== 'pending_verification');
            }

            if (filtered.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:32px; color:var(--text-muted);">No records found for this view.</td></tr>`;
                return;
            }

            let html = '';
            filtered.forEach(r => {
                const date = r.createdAt ? new Date(r.createdAt.toDate()).toLocaleDateString() : 'N/A';
                let badge = '';
                if (r.status === 'pending_verification') badge = '<span class="badge pending">Pending</span>';
                else if (r.status === 'approved') badge = '<span class="badge approved">Approved</span>';
                else badge = '<span class="badge rejected">Rejected</span>';

                let actionBtn = '';
                if (r.status === 'pending_verification') {
                    actionBtn = `<button class="btn-review" onclick="openReview('${r.id}')">Review</button>`;
                } else {
                    actionBtn = `<button class="btn-review" style="background:#E2E8F0; color:#475569;" onclick="openReview('${r.id}')">View</button>`;
                }

                html += `
                <tr>
                    <td>${date}</td>
                    <td style="font-family:monospace; font-weight:600;">${r.id}</td>
                    <td>
                        <div style="font-weight:700;">${r.planSnapshot?.name || 'Unknown Plan'}</div>
                        <div style="font-size:0.8rem; color:var(--text-muted);">${r.methodSnapshot?.name || 'Unknown Method'}</div>
                    </td>
                    <td style="font-weight:700;">RS ${r.amount || 0}</td>
                    <td>${badge}</td>
                    <td>${actionBtn}</td>
                </tr>`;
            });
            tableBody.innerHTML = html;
        }

        // Open Modal
        window.openReview = (id) => {
            activeRequest = allRequests.find(r => r.id === id);
            if (!activeRequest) return;

            document.getElementById('mProofImg').src = activeRequest.proofUrl || '';
            document.getElementById('mUid').textContent = activeRequest.uid || 'Unknown';
            document.getElementById('mTid').textContent = activeRequest.trxIdRaw || 'Unknown';
            document.getElementById('mAmount').textContent = `RS ${activeRequest.amount || 0}`;
            document.getElementById('mPlan').textContent = activeRequest.planSnapshot?.name || 'Unknown';

            rejectBox.style.display = 'none';
            document.getElementById('rejectReason').value = '';

            if (activeRequest.status === 'pending_verification') {
                actionGroup.style.display = 'flex';
            } else {
                actionGroup.style.display = 'none';
            }

            reviewModal.classList.add('show');
        };

        closeModal.addEventListener('click', () => { reviewModal.classList.remove('show'); });

        // Approval Logic
        document.getElementById('approveBtn').addEventListener('click', async () => {
            if (!activeRequest) return;
            const btn = document.getElementById('approveBtn');
            btn.disabled = true; btn.textContent = 'Approving...';

            try {
                const batch = db.batch();
                const reqRef = db.collection('payment_requests').doc(activeRequest.id);
                
                // 1. Update Request
                batch.update(reqRef, { 
                    status: 'approved', 
                    approvedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    approvedBy: adminUser.uid 
                });

                // 2. Find and Update Ledger Transaction
                const txSnap = await db.collection('users').doc(activeRequest.uid)
                                       .collection('transactions').where('referenceId', '==', activeRequest.id).get();
                txSnap.forEach(doc => {
                    batch.update(doc.ref, { status: 'completed' });
                });

                // 3. Optional: Add to user balance or create active plan
                // For architecture simplicity, we increment user balance so they can use it
                const userRef = db.collection('users').doc(activeRequest.uid);
                batch.update(userRef, {
                    balance: firebase.firestore.FieldValue.increment(Number(activeRequest.amount))
                });

                await batch.commit();
                reviewModal.classList.remove('show');
            } catch (error) {
                console.error("Approval failed:", error);
                alert("Approval failed. Please check permissions.");
            }
            btn.disabled = false; btn.textContent = 'Approve Deposit';
        });

        // Reject Workflow
        document.getElementById('rejectBtn').addEventListener('click', () => {
            actionGroup.style.display = 'none';
            rejectBox.style.display = 'block';
        });

        document.getElementById('confirmRejectBtn').addEventListener('click', async () => {
            if (!activeRequest) return;
            const reason = document.getElementById('rejectReason').value.trim();
            if (!reason) { alert("Please provide a reason for rejection."); return; }

            const btn = document.getElementById('confirmRejectBtn');
            btn.disabled = true; btn.textContent = 'Rejecting...';

            try {
                const batch = db.batch();
                const reqRef = db.collection('payment_requests').doc(activeRequest.id);
                
                batch.update(reqRef, { 
                    status: 'rejected', 
                    rejectionReason: reason,
                    rejectedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    rejectedBy: adminUser.uid 
                });

                // Fail the ledger transaction
                const txSnap = await db.collection('users').doc(activeRequest.uid)
                                       .collection('transactions').where('referenceId', '==', activeRequest.id).get();
                txSnap.forEach(doc => {
                    batch.update(doc.ref, { status: 'failed', note: reason });
                });

                await batch.commit();
                reviewModal.classList.remove('show');
            } catch (error) {
                console.error("Rejection failed:", error);
                alert("Rejection failed. Please check permissions.");
            }
            btn.disabled = false; btn.textContent = 'Confirm Rejection';
        });

        // Logout
        logoutBtn.addEventListener('click', () => { auth.signOut(); });
        menuBtn.addEventListener('click', () => { sidebar.classList.toggle('open'); });
    </script>
</body>
</html>
